name: quality-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: pwsh
        run: '"STORE_PATH=$(pnpm store path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('admin-web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate commit messages on pull requests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/check-commit-messages.ps1 -BaseRef "origin/${{ github.base_ref }}"

      - name: Validate commit messages on pushes
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/check-commit-messages.ps1 -BaseRef "${{ github.event.before }}"

      - name: Resolve review base
        id: review-base
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $base = if ($env:EVENT_NAME -eq 'pull_request') { "origin/$env:BASE_REF" } elseif ($env:EVENT_NAME -eq 'push') { $env:BEFORE_SHA } else { '' }
          "ref=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run shared quality gate
        shell: pwsh
        run: ./scripts/quality-gate.ps1 -ReviewBaseRef "${{ steps.review-base.outputs.ref }}"

      - name: Check high-risk evidence
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: ./scripts/check-risk-evidence.ps1 -BaseRef "origin/${{ github.base_ref }}" -EventPath $env:GITHUB_EVENT_PATH
