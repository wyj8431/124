name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve review base
        id: review-base
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $base = if ($env:EVENT_NAME -eq 'push') { $env:BEFORE_SHA } else { '' }
          "ref=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality-gate.ps1 -ReviewBaseRef "${{ steps.review-base.outputs.ref }}"

      - name: Build backend release JAR
        shell: pwsh
        working-directory: backend
        run: .\mvnw.cmd -q -DskipTests package

      - name: Package release artifacts
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match '^refs/tags/(.+)$') { $Matches[1] } else { "manual-$env:GITHUB_SHA" }
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "release/$version"
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          Copy-Item frontend/dist (Join-Path $releaseRoot 'frontend') -Recurse
          Copy-Item admin-web/dist (Join-Path $releaseRoot 'admin-web') -Recurse
          Copy-Item (Get-ChildItem backend/target -Filter '*.jar' | Where-Object { $_.Name -notlike '*-plain.jar' } | Select-Object -First 1).FullName (Join-Path $releaseRoot 'backend.jar')
          @{
            version = $version
            commit = $env:GITHUB_SHA
            builtAt = [DateTime]::UtcNow.ToString('o')
            contents = @('frontend', 'admin-web', 'backend.jar')
            deployment = 'Artifact-only release; configure target infrastructure before production rollout.'
          } | ConvertTo-Json | Set-Content (Join-Path $releaseRoot 'release-manifest.json')
          Compress-Archive -Path (Join-Path $releaseRoot '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "release/chuangkit-$version.zip") -Force

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: chuangkit-${{ github.ref_name }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip
