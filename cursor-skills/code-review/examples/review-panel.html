<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code Review Skill Panel</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; color: #1f2329; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 56px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; }
    p { color: #646a73; line-height: 1.6; }
    .toolbar, .report { border: 1px solid #e5e6eb; border-radius: 8px; background: #fff; }
    .toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) 160px auto; gap: 12px; padding: 16px; }
    label { display: grid; gap: 6px; color: #646a73; font-size: 12px; }
    select, button { min-height: 38px; border: 1px solid #d9dce2; border-radius: 6px; padding: 0 12px; font: inherit; background: #fff; color: #1f2329; }
    button { border-color: #1677ff; color: #fff; background: #1677ff; cursor: pointer; }
    button:hover { background: #0f67df; }
    .report { margin-top: 16px; padding: 20px; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    .badge { padding: 5px 9px; border-radius: 999px; color: #505a71; background: #f2f3f5; font-size: 12px; }
    .finding { padding: 14px 0; border-top: 1px solid #eef0f3; }
    .finding:first-child { border-top: 0; }
    .finding strong { display: block; margin-bottom: 5px; }
    .finding code { color: #1677ff; font-size: 12px; }
    .finding p { margin: 6px 0 0; font-size: 13px; }
    .high { color: #d4380d; } .medium { color: #d48806; } .low { color: #389e0d; } .info { color: #1677ff; }
    @media (max-width: 720px) { header { display: block; } .toolbar { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>代码审查 Skill</h1><p>命令触发、参数调整与结构化结果预览。</p></div><code id="status">就绪</code></header>
    <section class="toolbar">
      <label>审查命令<select id="scope"><option value="changed-files">/review changed-files</option><option value="component-standards">/review component-standards</option><option value="performance-issues">/review performance-issues</option><option value="types-and-contracts">/review types-and-contracts</option></select></label>
      <label>最低风险级别<select id="severity"><option value="info">Info</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label>
      <button id="run" type="button">运行审查</button>
    </section>
    <section class="report" aria-live="polite"><div class="summary" id="summary"></div><div id="findings"></div></section>
  </main>
  <script>
    const findings = [
      { severity: 'medium', category: 'types-and-contracts', file: 'frontend/src/pages/CodeReviewPage.tsx', line: 42, title: 'Avoid an explicit any type', recommendation: 'Use a domain type or unknown with a narrowed guard.' },
      { severity: 'low', category: 'performance', file: 'frontend/src/pages/HomePage.tsx', line: 118, title: 'Console output is present in application code', recommendation: 'Remove the log or route it through the project logger before shipping.' },
      { severity: 'info', category: 'verification', file: 'frontend/src/pages/CodeReviewPage.tsx', line: 18, title: 'Exported behavior has no nearby focused test', recommendation: 'Add a focused test covering the changed success, empty, and error paths.' }
    ];
    const rank = { high: 0, medium: 1, low: 2, info: 3 };
    const scope = document.querySelector('#scope');
    const severity = document.querySelector('#severity');
    const summary = document.querySelector('#summary');
    const target = document.querySelector('#findings');
    function render() {
      const visible = findings.filter((item) => rank[item.severity] <= rank[severity.value]);
      summary.innerHTML = '<span class="badge">范围：' + scope.value + '</span><span class="badge">结果：' + visible.length + '</span>';
      target.innerHTML = visible.length ? visible.map((item) => '<article class="finding"><strong class="' + item.severity + '">[' + item.severity + '] ' + item.title + '</strong><code>' + item.file + ':' + item.line + ' · ' + item.category + '</code><p>' + item.recommendation + '</p></article>').join('') : '<p>当前参数下没有可显示的问题。</p>';
    }
    document.querySelector('#run').addEventListener('click', () => { document.querySelector('#status').textContent = '已运行 ' + new Date().toLocaleTimeString(); render(); });
    scope.addEventListener('change', render); severity.addEventListener('change', render); render();
  </script>
</body>
</html>
