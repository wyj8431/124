<h2>AI 模式栏目顺序</h2>
<p class="subtitle">每个模式均展示五个官网栏目；当前模式对应的栏目组位于最前。</p>

<div class="cards">
  <div class="card" data-choice="agent" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:22px;background:#f8fafc">
      <div class="label">AGENT</div>
      <h3>小红书封面</h3>
      <p>营销海报</p>
      <p>亚马逊套图</p>
      <p>商品详情页</p>
      <p>短剧带货</p>
    </div>
    <div class="card-body"><h3>Agent 模式</h3><p>Agent 相关的两个栏目优先。</p></div>
  </div>
  <div class="card" data-choice="image" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:22px;background:#f8fafc">
      <div class="label">IMAGE</div>
      <h3>亚马逊套图</h3>
      <p>商品详情页</p>
      <p>小红书封面</p>
      <p>营销海报</p>
      <p>短剧带货</p>
    </div>
    <div class="card-body"><h3>图片模式</h3><p>图片创作的两个栏目优先。</p></div>
  </div>
  <div class="card" data-choice="video" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:22px;background:#f8fafc">
      <div class="label">VIDEO</div>
      <h3>短剧带货</h3>
      <p>小红书封面</p>
      <p>营销海报</p>
      <p>亚马逊套图</p>
      <p>商品详情页</p>
    </div>
    <div class="card-body"><h3>视频模式</h3><p>视频创作栏目优先，其余四栏保留。</p></div>
  </div>
</div>
