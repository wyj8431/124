server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: chuangkit-admin
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

---
# 开发环境：H2 内存库，开箱即用
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/chuangkit;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql,classpath:db/aishipin-inspiration.sql,classpath:db/aihaibao-inspiration.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

chuangkit:
  jwt:
    secret: chuangkit-admin-jwt-secret-key-2026-change-in-production
    expiration-ms: 86400000
  upload:
    base-url: http://localhost:8081/uploads
  ai:
    provider: ${AI_PROVIDER:mock}
    endpoint: ${AI_PROVIDER_ENDPOINT:}
    api-key: ${AI_PROVIDER_API_KEY:}
  sms:
    provider: ${SMS_PROVIDER:mock}
    code-expire-minutes: 5
    resend-interval-seconds: 60
    expose-debug-code: true
    aliyun:
      access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN:灵图工坊}
      template-code: ${ALIYUN_SMS_TEMPLATE:}

springdoc:
  api-docs:
    path: /admin/v3/api-docs
  swagger-ui:
    path: /admin/swagger-ui.html

---
# 生产环境：MySQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/chuangkit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: never

chuangkit:
  jwt:
    secret: ${CHUANGKIT_JWT_SECRET}
  sms:
    provider: aliyun
    expose-debug-code: false
